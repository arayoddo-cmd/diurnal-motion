<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>일주운동 관측소</title>
<meta name="description" content="지구의 자전 방향과 태양·달·별의 일주 운동 방향을 3D로 돌려 보며 예측하고 확인하는 수업 자료">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b1a; --panel:#111934; --line:#2a3768;
  --text:#eef2ff; --muted:#a9b4d8; --accent:#ffcf5a; --accent2:#7cc4ff;
  --ok:#5fe0a0; --bad:#ff8a8a; --chip:#1f2b5a; --chiph:#2b3a78;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6;min-height:100vh;-webkit-tap-highlight-color:transparent}
#app{max-width:1280px;margin:0 auto;padding:14px 16px 60px}
#app:has(.cl-stage){max-width:1880px} /* 수업 모드(TV)는 화면을 넓게 */
h1,h2,h3,.title{font-family:"Do Hyeon","Noto Sans KR",sans-serif;font-weight:400;letter-spacing:.5px;margin:0}
h1{font-size:clamp(36px,6vw,58px);line-height:1.15}
h2{font-size:26px}
h3{font-size:22px;margin-bottom:6px}
p{margin:.4em 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--accent);color:#1b1400;border:0;border-radius:999px;padding:12px 24px;font-weight:700;font-size:17px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn.small{padding:7px 14px;font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
input{font:inherit;color:var(--text);background:#0b1230;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus{outline:2px solid var(--accent2);border-color:transparent}
label{display:block;font-weight:700;margin:10px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top .grow{flex:1}
.pill{background:var(--chip);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--muted)}
.pill b{color:var(--text)}

/* 처음 화면 */
.intro{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;align-items:center;min-height:88vh}
.intro>*{min-width:0}
.intro-r{display:flex;flex-direction:column;gap:12px}
.kicker{color:var(--accent2);font-weight:700;margin:0;font-size:14px}
.lead{font-size:18px}
.lead b{color:var(--accent)}
@media (max-width:920px){.intro{grid-template-columns:1fr;min-height:auto}}

/* 3D 화면 */
.stage{position:relative;width:100%;height:min(66vh,640px);min-height:320px;border-radius:var(--r);overflow:hidden;background:#050914;border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
@media (max-width:920px){.stage{height:min(56vh,540px)}}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage canvas.ov{pointer-events:none}
.stage .hud{position:absolute;left:10px;top:10px;right:10px;pointer-events:none;font-size:14px;font-weight:700;line-height:1.4}
.stage .hud span{display:inline-block;background:#08102ecc;border:1px solid #ffffff26;border-radius:12px;padding:5px 12px}
.stage .hud span:empty{display:none}
.stage .face{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);pointer-events:none;background:#08102ecc;border:1px solid #ffffff26;border-radius:999px;padding:6px 18px;font-weight:700;white-space:nowrap;font-size:clamp(14px,2.4vw,19px)}
.stage .face:empty{display:none}
.stage .nogl{display:flex;align-items:center;justify-content:center;height:100%;padding:20px;text-align:center;color:var(--muted)}

/* 조작 버튼 */
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.group{display:flex;gap:3px;flex-wrap:wrap;align-items:center;background:#0b1230;border:1px solid var(--line);border-radius:999px;padding:3px}
.group .lbl{font-size:13px;color:var(--muted);padding:0 6px 0 10px}
.chip{background:var(--chip);border:1.5px solid transparent;border-radius:999px;padding:6px 14px;font-size:15px;min-height:40px}
.chip:hover{background:var(--chiph)}
.chip.on{background:var(--accent2);color:#06142b;font-weight:700}
.chip.big{font-weight:700;padding:6px 20px}
.chip.play{background:var(--accent);color:#1b1400;font-weight:700}
.group .chip{min-height:36px;padding:4px 12px}
input[type=range]{width:150px;accent-color:var(--accent);padding:0;border:0;background:transparent;margin:0 6px}
.latv{font-weight:700;min-width:58px;font-size:14px;padding-right:8px}

/* 수업 모드 */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:var(--chip);border:1.5px solid transparent;border-radius:12px;padding:8px 14px;font-weight:700;font-size:15px}
.tab.on{border-color:var(--accent);color:var(--accent);background:var(--chiph)}
.lesson{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:14px;align-items:start}
.lesson>*{min-width:0}
@media (max-width:920px){.lesson{grid-template-columns:1fr}}
.concept ol{padding-left:22px;margin:8px 0}
.concept li{margin:10px 0;font-size:17px;line-height:2}
.blank{display:inline-block;min-width:54px;text-align:center;border:0;border-bottom:2.5px solid var(--accent);background:#ffcf5a14;color:var(--accent);padding:0 8px;margin:0 2px;font-weight:700;border-radius:6px 6px 0 0;line-height:1.6}
button.blank:not(.show){color:transparent}
.blank.ok{border-color:var(--ok);color:var(--ok)}
/* 수업 모드: TV로 함께 보도록 3D 화면을 크게, 정리 카드는 아래에 큰 글씨로 */
/* 수업 모드: 넓은 화면에서는 버튼을 관측 화면 오른쪽 세로 칸에 모아 스크롤 없이 조작해요 */
.cl-stage .stage{height:max(420px,calc(100vh - 200px))}
@media (min-width:1000px){
  .cl-stage{display:grid;grid-template-columns:minmax(0,1fr) clamp(250px,21vw,340px);gap:12px;align-items:start}
  .cl-stage .stage{height:max(420px,calc(100vh - 100px))}
  .cl-side{max-height:calc(100vh - 100px);overflow-y:auto;overflow-x:hidden;padding-right:2px}
  .cl-side .ctrl{flex-direction:column;align-items:stretch;margin:0 0 10px}
  .cl-side .ctrl>*{max-width:100%}
  .cl-side .group{border-radius:16px;padding:5px}
  .cl-side .group .lbl{flex-basis:100%;padding:2px 8px 4px}
  .cl-side .group .chip{flex:1 1 auto}
  .cl-side .ctrl>.chip,.cl-side .ctrl>button{width:100%}
  .cl-side input[type=range]{width:100%}
}
.cl-stage .chip{font-size:17px;min-height:46px}
.cl-stage .group .chip{min-height:42px}
.concept.big{margin-top:16px}
.concept.big h3{font-size:clamp(24px,2.6vw,34px)}
.concept.big li{font-size:clamp(22px,2.4vw,32px);margin:12px 0}
.concept.big .ask{font-size:clamp(19px,1.9vw,26px)}
button.blank:not(.show){color:#ffcf5aa8;letter-spacing:.12em}
.concept.big h3{font-size:clamp(30px,3.2vw,48px)}
.concept.big li{font-size:clamp(28px,3vw,46px);margin:14px 0;line-height:1.9}
.concept.big .ask{font-size:clamp(24px,2.4vw,36px);line-height:1.6}
.concept.big .note{font-size:clamp(18px,1.6vw,24px)}
.concept.big .blank{min-width:1.6em;padding:0 .3em}
.concept.big ol{font-size:clamp(28px,3vw,46px);padding-left:1.6em}
.wsp{display:inline-block;background:#3dff8f;color:#03230f;font-weight:900;border-radius:999px;padding:4px 16px;font-size:clamp(17px,1.5vw,22px);box-shadow:0 0 16px #3dff8f88;white-space:nowrap;margin:0 8px}
.wsp.none{background:#c4b0ff;color:#1a0b45;box-shadow:0 0 16px #c4b0ff88}
.concept.big .wsp{font-size:clamp(24px,2.3vw,34px);padding:6px 22px}
.concept .ex{color:#c4b0ff}
.concept .wsk{color:#fff}
.concept.big .leg{font-size:clamp(20px,1.8vw,28px)}
.ask{background:#1c2a5c;border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;margin-top:12px;font-size:15px}
.ask b{color:var(--accent)}

/* 탐사 모드 */
.mcards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (max-width:700px){.mcards{grid-template-columns:1fr}}
.mcard{display:flex;flex-direction:column;gap:8px}
.mcard .n{font-family:"Do Hyeon";color:var(--accent);font-size:15px}
.mcard.lock{opacity:.5}
.mcard .row{margin-top:auto}
.st-done{color:var(--ok);font-weight:700}
.check{list-style:none;padding:0;margin:6px 0 12px}
.check li{padding:3px 0}
.check li.ok{color:var(--ok)}
.q{border-top:1px solid var(--line);padding:12px 0}
.q:first-of-type{border-top:0}
.q.locked{opacity:.4}
.q .s{font-size:17px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.opt{background:var(--chip);border:1.5px solid var(--line);border-radius:999px;padding:7px 16px;font-size:15px}
.opt:hover{background:var(--chiph)}
.opt:disabled{cursor:default}
.opt.no{opacity:.35;text-decoration:line-through;pointer-events:none}
.opt.sel{background:var(--accent);color:#1b1400;border-color:var(--accent);opacity:1}
.fb{font-size:15px;margin-top:6px}
.fb.ok{color:var(--ok)}
.fb.bad{color:var(--bad)}
.fb.ex{color:var(--text);background:#16224a;border-radius:8px;padding:6px 10px}
.done{background:#173a2c;border:1px solid var(--ok);border-radius:12px;padding:12px 14px;margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.done b{flex:1;min-width:160px}
.retry{background:#3a1c24;border:1px solid var(--bad);border-radius:12px;padding:12px 14px;margin-top:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.retry span{font-size:14px;color:var(--muted)}
.st-retry{color:var(--bad);font-weight:700}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.stp{background:var(--chip);border:1.5px solid transparent;border-radius:999px;padding:5px 12px;font-size:14px}
.stp.on{border-color:var(--accent);color:var(--accent)}
.stp.ok::after{content:" ✓";color:var(--ok)}
.stp:disabled{opacity:.35;cursor:not-allowed}
.popts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.popt{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--chip);border:2px solid transparent;border-radius:14px;padding:8px 4px;font-size:13px;word-break:keep-all;text-align:center;line-height:1.35}
.popt svg{width:56px;height:56px}
.popt:hover{background:var(--chiph)}
.popt:disabled{cursor:default}
.popt.no{opacity:.35;border-color:var(--bad)}
.popt.sel{border-color:var(--ok);background:#173a2c}
.quiz{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.quiz>*{min-width:0}
@media (max-width:820px){.quiz{grid-template-columns:1fr}}
.quiz .q{border-top:0;padding:0}
svg.fig{width:100%;max-height:250px;border-radius:10px;background:#0b1230;display:block;margin-bottom:10px}
.score{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:16px;margin:10px 0}
.score dt{color:var(--muted)}
.score dd{margin:0;font-weight:700}

/* 교사 화면 */
.tstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.tstats div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--muted)}
.tstats b{display:block;font-family:"Do Hyeon";font-size:28px;color:var(--text)}
.tbl-wrap{overflow-x:auto}
.ttbl{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
.ttbl th,.ttbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left}
.ttbl th{color:var(--muted);font-weight:500}
.tok{color:var(--ok);font-weight:700}

/* 보너스: 자전 지구 발사대 */
.gwrap{position:relative;max-width:620px;margin:0 auto}
.gwrap canvas{width:100%;height:auto;display:block;border-radius:var(--r);border:1px solid var(--line);background:#050914;touch-action:manipulation}
.ghud{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.gmsg{min-height:1.6em;font-weight:700;margin-top:6px}
.gover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#050914d9;border-radius:var(--r);text-align:center;padding:20px}
.gover .row{justify-content:center}
.lvls{display:grid;gap:10px;margin:10px 0}
.lvl{text-align:left;background:var(--chip);border:2px solid transparent;border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.lvl.on{border-color:var(--accent)}
.lvl:disabled{opacity:.45;cursor:not-allowed}
.lvl span{font-size:14px;color:var(--muted)}
.gpick{justify-content:center;margin:10px 0}
.gpick b{font-family:"Do Hyeon";font-size:30px;min-width:110px;text-align:center}
</style>
</head>

<script>
'use strict';
/* ───────── 설정 ─────────
   SUBMIT_URL: 태양계 탐사대와 같은 Apps Script 주소. 결과는 같은 구글 시트의 '일주운동 현황' 탭에 모여요.
   (Apps Script를 이 폴더의 apps-script.gs로 바꾸고 새 버전으로 배포해야 저장돼요. README 참고) */
const CONFIG = {

  LESSON: '일주운동'
};
const D2R = Math.PI / 180;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const fmtH = t => (Math.round(t * 10) / 10) + '시간';
// 하루 중 시각을 '저녁 8시', '새벽 2시 30분'처럼 표시
function clockK(h) {
  h = ((h % 24) + 24) % 24;
  const hh = Math.floor(h + 1e-6), mm = Math.floor((h - hh) * 6 + 1e-6) * 10;
  const part = hh === 0 ? '밤' : hh < 5 ? '새벽' : hh < 12 ? '오전' : hh === 12 ? '낮' : hh < 18 ? '오후' : hh < 21 ? '저녁' : '밤';
  const h12 = hh % 12 === 0 ? 12 : hh % 12;
  return `${part} ${h12}시${mm ? ' ' + mm + '분' : ''}`;
}

/* ───────── 하늘의 별 ─────────
   [적경(시), 적위(°), 등급]. 별자리는 실제 위치에 가깝게, 나머지 별은 고르게 흩뿌렸어요. */
const LST0 = 3; // 시작할 때 남쪽 하늘 한가운데(자오선)에 오는 적경
const CONSTS = [
  { name: '북두칠성', label: 3, stars: [[11.06, 61.75, 1.8], [11.03, 56.38, 2.3], [11.90, 53.69, 2.4], [12.26, 57.03, 3.3], [12.90, 55.96, 1.8], [13.40, 54.93, 2.2], [13.79, 49.31, 1.9]], lines: [[0, 1], [1, 2], [2, 3], [3, 0], [3, 4], [4, 5], [5, 6]] },
  { name: '카시오페이아자리', label: 2, stars: [[0.15, 59.15, 2.3], [0.68, 56.54, 2.2], [0.95, 60.72, 2.5], [1.43, 60.24, 2.7], [1.91, 63.67, 3.4]], lines: [[0, 1], [1, 2], [2, 3], [3, 4]] },
  { name: '오리온자리', label: 3, stars: [[5.92, 7.41, 0.5], [5.42, 6.35, 1.6], [5.53, -0.30, 2.2], [5.60, -1.20, 1.7], [5.68, -1.94, 1.8], [5.80, -9.67, 2.1], [5.24, -8.20, 0.3]], lines: [[0, 1], [1, 2], [0, 4], [2, 3], [3, 4], [4, 5], [2, 6]] }
];
const STARS = [];
function addStar(ra, dec, mag, con) { STARS.push({ h0: (LST0 - ra) * 15 * D2R, dec: dec * D2R, mag, con, p: null }); return STARS.length - 1; }
(() => {
  const r = rng(7);
  for (let i = 0; i < 300; i++) addStar(r() * 24, Math.asin(2 * r() - 1) / D2R, 5 - 2.6 * Math.pow(r(), 3), null);
  CONSTS.forEach(c => { c.idx = c.stars.map(s => addStar(s[0], s[1], s[2], c)); });
})();
const POLARIS = addStar(2.53, 89.26, 2.0, 'polaris');
const SUN_H0 = -90 * D2R; // 태양·달은 시작할 때 정확히 동쪽 지평선에서 떠요

/* ───────── 지구 지도 (경도, 위도) ─────────
   대륙을 단순하게 그린 것이에요. 방향을 알아보는 데 쓰는 그림이라 실제 해안선과는 조금 달라요. */

  /* 화면 위 글자 (경과 시간 등) */

/* ───────── 위도에 따른 별의 일주 운동 (북극·우리나라·적도) 그림 ─────────
   지평 좌표(동 x, 북 y, 위 z)로 별의 길을 계산해서, 남동쪽 조금 위에서 본 반구로 그려요. */
const FIGLAT = (() => {
  const R = 118, D = Math.PI / 180, rot = -28 * D, el = 22 * D;
  const prj = (cx, cy, x, y, z) => {
    const xr = x * Math.cos(rot) - y * Math.sin(rot), yr = x * Math.sin(rot) + y * Math.cos(rot);
    return { X: cx - yr * R, Y: cy - (z * Math.cos(el) - xr * Math.sin(el)) * R, d: xr * Math.cos(el) + z * Math.sin(el) };
  };
  const star = (lat, dec, H) => {
    const p = lat * D, d = dec * D;
    return [-Math.cos(d) * Math.sin(H), Math.cos(p) * Math.sin(d) - Math.sin(p) * Math.cos(d) * Math.cos(H), Math.sin(p) * Math.sin(d) + Math.cos(p) * Math.cos(d) * Math.cos(H)];
  };
  const f = n => n.toFixed(1);
  const panel = (cx, lat, decs, title, sub1, sub2) => {
    const cy = 220; let s = '';
    // 지평면
    let hz = ''; for (let i = 0; i <= 72; i++) { const a = i * 5 * D, q = prj(cx, cy, Math.cos(a), Math.sin(a), 0); hz += (i ? 'L' : 'M') + f(q.X) + ' ' + f(q.Y); }
    s += `<path d="${hz}Z" fill="#2f6b45" fill-opacity=".85" stroke="#b9d98a" stroke-width="2"/>`;
    // 하늘 반구 윤곽(화면에서 보이는 테두리)
    s += `<path d="M${f(cx - R)} ${f(cy)}A${R} ${R} 0 0 1 ${f(cx + R)} ${f(cy)}" fill="#7cc4ff" fill-opacity=".10" stroke="#9fd3ff" stroke-opacity=".7" stroke-width="1.6"/>`;
    // 별의 길
    decs.forEach(dec => {
      let seg = '', prevFront = null, out = '';
      const flush = () => { if (seg) out += `<path d="${seg}" fill="none" stroke="#ffd84a" stroke-width="2.6"${prevFront ? '' : ' stroke-dasharray="5 6" stroke-opacity=".55"'}/>`; seg = ''; };
      for (let i = 0; i <= 144; i++) {
        const H = (i * 2.5 - 180) * D, v = star(lat, dec, H);
        if (v[2] < -0.001) { flush(); prevFront = null; continue; }
        const q = prj(cx, cy, v[0], v[1], v[2]), front = q.d > -0.02;
        if (prevFront !== null && front !== prevFront) { seg += 'L' + f(q.X) + ' ' + f(q.Y); flush(); }
        if (prevFront !== front || !seg) seg += 'M' + f(q.X) + ' ' + f(q.Y); else seg += 'L' + f(q.X) + ' ' + f(q.Y);
        prevFront = front;
      }
      flush(); s += out;
      // 앞쪽에서 움직이는 방향 화살표 하나
      let best = null;
      for (let i = -60; i <= 60; i++) {
        const H = i * 2.5 * D, v = star(lat, dec, H); if (v[2] < 0.05) continue;
        const q = prj(cx, cy, v[0], v[1], v[2]); if (q.d < 0.15) continue;
        if (!best || q.d > best.q.d) best = { q, H };
      }
      if (best) {
        const v2 = star(lat, dec, best.H + 6 * D), q2 = prj(cx, cy, v2[0], v2[1], v2[2]);
        const ang = Math.atan2(q2.Y - best.q.Y, q2.X - best.q.X) * 180 / Math.PI;
        s += `<path d="M9 0L-6 -7L-6 7Z" fill="#ffd84a" transform="translate(${f(best.q.X)} ${f(best.q.Y)}) rotate(${f(ang)})"/>`;
      }
    });
    // 관측자, 북극성과 고도
    const o = prj(cx, cy, 0, 0, 0), pol = prj(cx, cy, 0, Math.cos(lat * D), Math.sin(lat * D)), nN = prj(cx, cy, 0, 1, 0);
    s += `<line x1="${f(o.X)}" y1="${f(o.Y)}" x2="${f(nN.X)}" y2="${f(nN.Y)}" stroke="#ff6b6b" stroke-width="1.6" stroke-dasharray="4 4"/>`;
    s += `<line x1="${f(o.X)}" y1="${f(o.Y)}" x2="${f(pol.X)}" y2="${f(pol.Y)}" stroke="#ff6b6b" stroke-width="2"/>`;
    s += `<rect x="${f(o.X - 4)}" y="${f(o.Y - 22)}" width="8" height="22" rx="3" fill="#e8eeff"/><circle cx="${f(o.X)}" cy="${f(o.Y - 27)}" r="6" fill="#e8eeff"/>`;
    s += `<text x="${f(pol.X)}" y="${f(pol.Y + 9)}" font-size="26" fill="#ff6b6b" text-anchor="middle">★</text>`;
    const pl = lat > 60 ? { x: pol.X + 14, y: pol.Y - 4, a: 'start' } : lat > 10 ? { x: pol.X - 12, y: pol.Y - 12, a: 'end' } : { x: pol.X - 8, y: pol.Y + 30, a: 'end' };
    s += `<text x="${f(pl.x)}" y="${f(pl.y)}" font-size="17" fill="#ffb3b3" font-weight="700" text-anchor="${pl.a}">북극성 ${lat}°</text>`;
    // 방위
    [['북', 0, 1], ['남', 0, -1], ['동', 1, 0], ['서', -1, 0]].forEach(([n, x, y]) => { const q = prj(cx, cy, x * 1.13, y * 1.13, 0); s += `<text x="${f(q.X)}" y="${f(q.Y + 7)}" font-size="19" fill="${n === '서' ? '#c9d2ee' : '#fff'}" font-weight="800" text-anchor="middle">${n}</text>`; });
    s += `<text x="${cx}" y="34" font-size="23" fill="#ffd84a" font-weight="800" text-anchor="middle">${title}</text>`;
    s += `<text x="${cx}" y="318" font-size="18" fill="#e8eeff" font-weight="700" text-anchor="middle">${sub1}</text><text x="${cx}" y="342" font-size="18" fill="#e8eeff" font-weight="700" text-anchor="middle">${sub2}</text>`;
    return s;
  };
  return `<svg viewBox="0 0 960 356" style="display:block;width:100%;max-width:960px;margin:12px auto 4px" role="img" aria-label="북극, 우리나라, 적도에서 본 별의 일주 운동 비교 그림">
${panel(160, 90, [80, 60, 40, 15], '북극 (위도 90°)', '북극성이 머리 위', '별이 지평선과 나란히 돌아요')}
${panel(480, 37.5, [72, 45, 15, -15], '우리나라 (위도 37.5°)', '북극성이 37.5° 높이', '별이 비스듬히 뜨고 져요')}
${panel(800, 0, [60, 30, 0, -30, -60], '적도 (위도 0°)', '북극성이 지평선에', '별이 지평선에 수직으로 뜨고 져요')}
</svg>`;
})();

const TABS = [
  { name: '① 지구의 자전', title: '🌍 지구의 자전', pg: '8쪽 1-(1) 지구의 자전', setup: { view: 'earth', earthCam: 'side' },

    ? `<h2>🎉 ${L.name} 성공!</h2><p>${G.lv === 0 ? '지구가 서 → 동으로 돌면서 우리나라가 위성 아래를 차례로 지나갔어요.' : G.lv === 1 ? '우리나라는 오후 6시쯤 밤으로 들어가고 오전 6시쯤 낮으로 나와요. 낮과 밤은 지구의 자전 때문에 생겨요.' : `${G.right}/${G3.length} 명중! 지구는 1시간에 15°씩, 시계 반대 방향으로 돌아요.`}</p>
<div class="row">${G.lv < 2 ? '<button class="btn" data-act="gup">다음 단계 →</button>' : '<p>🏆 3단계까지 모두 깼어요! 자전 박사 인정!</p>'}<button class="btn ghost small" data-act="gagain">🔁 다시 하기</button><button class="btn ghost small" data-act="gmenu">단계 고르기</button></div>`
    : `<h2>😢 아쉬워요!</h2><p>${G.sats ? '로켓을 다 썼어요. 우리나라가 위성 바로 아래에 오는 순간을 노려 보세요.' : `${G.right}/${G3.length} 명중. 4문제 이상 맞히면 성공이에요.`}</p><div class="row"><button class="btn" data-act="gagain">🔁 다시 도전</button><button class="btn ghost small" data-act="gmenu">단계 고르기</button></div>`}</div>` : '';
  return head + `<div class="lesson"><div><div class="ghud" id="gHud"></div><div class="gwrap"><canvas id="gCanvas" width="${G_W}" height="${G_W}" data-act="gshoot" aria-label="자전 지구 발사대 게임 화면"></canvas>${over}</div><p class="gmsg" id="gMsg"></p></div><aside class="panel">${side}</aside></div>`;
}

/* ───────── 그리기 ───────── */
const app = document.getElementById('app');
const VIEWS = { intro: viewIntro, class: viewClass, map: viewMap, m1: viewM1, m2: viewM2, m3: viewM3, m4: viewM4, cert: viewCert, teacher: viewTeacher, game: viewGame };
function render() {
  app.innerHTML = (VIEWS[state.view] || viewIntro)();
  const slot = app.querySelector('.stage-slot'); if (slot) slot.replaceWith(Stage.el);
}
function tabSetup() {
  const T = TABS[ui.tab];
  Stage.set(Object.assign({ playing: false, trails: false, arrows: true, polar: false, below: false }, T.setup));
  Stage.reset(); Stage.preset();
}
function m3Setup() {
  const st = M3[state.m3.step], solved = m3StepOk(st.k);
  ui.fb = {};
  if (st.az != null) Stage.set({ view: 'sky', lat: 37.5, target: 'star', cam: 'look', az: st.az, trails: solved, arrows: solved, below: false, polar: false, playing: false, paths: true, faceAz: st.az });
  else Stage.set({ view: 'sky', lat: 37.5, target: 'sun', cam: 'out', trails: solved, arrows: solved, below: false, polar: false, playing: false, paths: false, faceAz: null });
  Stage.reset(); Stage.preset();
  if (solved) Stage.replay(st.k === 'sun' ? 12 : 4, st.k === 'sun' ? 2 : 1.2);
}
function enter(v) {
  if (['map', 'm1', 'm2', 'm3', 'm4', 'cert', 'game'].includes(v) && !state.num) v = 'intro';
  const i = MISSIONS.findIndex(m => m.v === v);
  if (i > 0 && !unlocked(i)) v = 'map';
  if (v === 'game' && !gOpen()) v = 'map';
  if (v === 'game') { if (G) cancelAnimationFrame(G.raf); G = null; }
  state.view = v; ui.fb = {}; ui.submitMsg = '';
  // 임무 3 길잡이는 그 화면에서만 켜고, 다른 화면으로 가면 꺼요
  Stage.set({ paths: false, faceAz: null });
  if (v === 'intro') { Stage.set({ view: 'sphere', frame: 'sky', playing: true, speed: 1, arrows: true }); Stage.preset(); }
  if (v === 'class') tabSetup();
  // 관찰 체크는 임무 화면에서 본 시간만 세요 (수업 모드에서 본 시간은 빼요)
  if (CHECK[v]) CHECK[v].forEach(([k]) => { delete Stage.watch[k]; });
  if (v === 'm1') { Stage.set({ view: 'earth', earthCam: 'side', playing: false, speed: 1 }); Stage.reset(); Stage.preset(); }
  if (v === 'm2') { Stage.set({ view: 'sphere', frame: 'earth', playing: false, speed: 1 }); Stage.reset(); Stage.preset(); }
  if (v === 'm3') { state.m3.step = Math.min(state.m3.step, m3First()); m3Setup(); }
  save(); render(); window.scrollTo(0, 0);
}
Stage.hooks.watch = k => {
  const m = state.view === 'm1' || state.view === 'm2' ? state[state.view] : null;
  if (m && CHECK[state.view].some(([kk]) => kk === k) && !m.seen[k]) { m.seen[k] = true; save(); render(); }
};
Stage.hooks.change = why => {
  // 수업 모드에서 잇기 장면이 끝나면 그 화면에 맞는 탭 카드로 바꿔요 (3D 화면은 그대로)
  if (state.view === 'class') { if (why === 'toSky') ui.tab = 2; if (why === 'toSphere') ui.tab = 1; }
  if (Stage.el.isConnected) render();
};

/* ───────── 동작 ───────── */
app.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const a = t.dataset.act, v = t.dataset.v, S = Stage.S;
  if (a === 'enter') enter(v);
  else if (a === 'tab') { ui.tab = +t.dataset.i; tabSetup(); render(); }
  else if (a === 'reveal') { ui.rev[t.dataset.k] = !ui.rev[t.dataset.k]; render(); }
  else if (a === 'revall') {
    const T = TABS[ui.tab], keys = [];
    T.lines.forEach((l, i) => { let n = 0; l.replace(/\[(.+?)\]/g, () => keys.push(ui.tab + '-' + i + '-' + (n++))); });
    const show = !keys.every(k => ui.rev[k]); keys.forEach(k => { ui.rev[k] = show; }); render();
  }
  else if (a === 'play') { Stage.play(); render(); }
  else if (a === 'step') { Stage.step(1); render(); }
  else if (a === 'reset') { Stage.reset(); render(); }
  else if (a === 'spd') { Stage.set({ speed: +v }); render(); }
  else if (a === 'ecam') { Stage.set({ earthCam: v }); render(); }
  else if (a === 'frame') { Stage.set({ frame: v }); Stage.reset(); render(); }
  else if (a === 'cam') { if (v === 'out') Stage.set({ cam: 'out' }); else Stage.set({ cam: 'look', az: +v }); render(); }
  else if (a === 'tgt') { Stage.set({ target: v }); render(); }
  else if (a === 'link') { Stage.link(+v); render(); }
  else if (a === 'tog') { const k = v; Stage.set({ [k]: !S[k] }); if (k === 'trails') Stage.trailReset(); render(); }
  else if (a === 'start') startMission(t);
  else if (a === 'wipe') {
    if (confirm('이 기기에 저장된 탐사 기록을 모두 지울까요? (선생님께 보낸 결과는 지워지지 않아요)')) {
      state = fresh(); try { localStorage.removeItem(KEY); } catch (err) {} enter('intro');
    }
  }
  else if (a === 'ans') {
    const m = t.dataset.m, i = +t.dataset.i, j = +t.dataset.j, [qs, recf] = QS[m], rec = recf(), q = qs[i];
    if (m === 'm1' || m === 'm2') { if (!seenAll(m)) return; }
    const r = rec[i] || (rec[i] = { no: [] }); if (r.ok) return;
    if (j === q.a) { r.ok = true; ui.fb[m + i] = ''; }
    else { if (!r.no.includes(j)) r.no.push(j); ui.fb[m + i] = `🔎 다시 생각해 봐요.${q.h ? ' ' + esc(q.h) : ''}`; }
    save(); render();
  }
  else if (a === 'pred') {
    const st = M3[state.m3.step], s = state.m3.s[st.k] || (state.m3.s[st.k] = { no: [] }); if (s.ok) return;
    const o = st.k === 'sun' ? +t.dataset.o : t.dataset.o;
    if (o === st.a) { s.ok = true; ui.fb.m3 = { ok: true, msg: s.no.length ? '✔ 맞아요! 직접 관찰해서 찾았어요.' : '🎯 예측 성공! 화면에서 확인해 보세요.' }; }
    else { if (!s.no.includes(o)) s.no.push(o); ui.fb.m3 = { ok: false, msg: '🤔 예측과 실제를 비교해 보세요. 화면에서 노란 화살표와 자취를 보고 다시 골라요.' }; }
    if (st.az != null) Stage.set({ cam: 'look', az: st.az });
    Stage.replay(st.k === 'sun' ? 12 : 4, st.k === 'sun' ? 2 : 1.2);
    save(); render();
  }
  else if (a === 'm3replay') { const st = M3[state.m3.step]; if (st.az != null) Stage.set({ cam: 'look', az: st.az }); Stage.replay(st.k === 'sun' ? 12 : 4, st.k === 'sun' ? 2 : 1.2); render(); }
  else if (a === 'm3go') { state.m3.step = +t.dataset.i; m3Setup(); save(); render(); }
  else if (a === 'm3cam') { const st = M3[state.m3.step]; if (v === 'out') Stage.set({ cam: 'out' }); else Stage.set({ cam: 'look', az: st.az }); render(); }
  else if (a === 'retry') {
    // 통과 기준을 넘지 못한 임무를 처음부터 다시 풀어요 (관찰 체크는 그대로 둬요)
    const m = v; state[m].tries = (state[m].tries || 0) + 1;
    if (m === 'm3') Object.assign(state.m3, { step: 0, s: {} }); else state[m].q = {};
    ui.fb = {}; enter(m);
  }
  else if (a === 'm3next') { state.m3.step = Math.min(M3.length - 1, state.m3.step + 1); m3Setup(); save(); render(); window.scrollTo(0, 0); }
  else if (a === 'teacher') { ui.teacher = null; state.view = 'teacher'; render(); }
  else if (a === 'tload') teacherLoad();
  else if (a === 'tcls') { ui.teacher.cls = t.dataset.c; render(); }
  else if (a === 'submit') submit();
  else if (a === 'glv') { ui.gLv = +v; render(); }
  else if (a === 'gstart') gGo(gLevel());
  else if (a === 'gshoot') gShoot();
  else if (a === 'gpick') { if (!G.fired) { G.pick = clamp(G.pick + +v, 1, 23); render(); } }
  else if (a === 'gfire') { if (!G.fired) { G.fired = true; G.anim = G.pick; render(); } }
  else if (a === 'gnext') { if (G.round < G3.length - 1) { G.round++; gRound(); render(); } else gEnd(G.right >= 4); }
  else if (a === 'gagain') gGo(G.lv);
  else if (a === 'gup') { ui.gLv = G.lv + 1; gGo(G.lv + 1); }
  else if (a === 'gmenu') { cancelAnimationFrame(G.raf); G = null; render(); }
});
document.addEventListener('keydown', e => {
  if (state.view === 'game' && G && G.sats && e.code === 'Space') { e.preventDefault(); gShoot(); }
});
async function startMission(btn) {
  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const num = val('num'), name = val('name'), msg = document.getElementById('introMsg');
  if (!num || !name) { msg.textContent = '학번과 이름을 모두 입력해 주세요.'; return; }
  if (CONFIG.SUBMIT_URL) {
    const code = val('ccode');
    if (!code) { msg.textContent = '수업 코드도 입력해 주세요.'; return; }
    msg.textContent = '수업 코드를 확인하는 중…'; btn.disabled = true;
    try {
      const out = await post({ lesson: CONFIG.LESSON, action: 'check', code });
      if (!out.ok) { msg.textContent = '수업 코드가 맞지 않아요. 다시 확인해 주세요.'; btn.disabled = false; return; }
    } catch (err) { /* 인터넷이 잠시 안 되면 일단 시작하고, 나중에 다시 보내요 */ }
    state.code = code;
  }
  state.num = num; state.name = name;
  // 선생님 시험용: 학번 00000이면 모든 임무·게임 단계가 열린 임무 목록으로 (시트 보내기 시험은 📋 결과에서)
  enter('map');
}

/* ───────── 선생님께 진행 상황 보내기 ─────────
   임무를 풀 때마다 자동으로 보내요. 시트 '일주운동 현황' 탭에 학생 한 명당 한 줄로 저장돼요. */
async function post(body) {
  const res = await fetch(CONFIG.SUBMIT_URL, { method: 'POST', body: JSON.stringify(body) });
  return res.json();
}
// 예전 Apps Script(태양계 탐사대 전용)에 보내면 엉뚱한 탭에 저장될 수 있어서, 새 버전인지 먼저 확인해요
async function hello() {
  if (ui.server != null) return ui.server;
  const out = await post({ action: 'hello' });
  ui.server = !!(out && out.lessons);
  return ui.server;
}
const COLS = ['임무 1 자전', '임무 2 천구', '임무 3 하늘 관측', '임무 4 확인 퀴즈', '자전 문제 (한 번에)', '천구 문제 (한 번에)', '하늘 관측 (한 번에)', '확인 퀴즈 (한 번에)', '틀린 예측', '보너스 발사대', '재도전 (임무 1·2·3·4)'];
function progressVals() {
  const MV = ['m1', 'm2', 'm3', 'm4'];
  const stat = (i, a, b) => MISSIONS[i].done() ? '완료' : failed(MV[i]) ? '재도전 필요' : a ? `진행 ${a}/${b}` : '-';
  const m3ok = M3.filter(s => m3StepOk(s.k)).length;
  const pred = M3.filter(s => (state.m3.s[s.k] || {}).ok && !state.m3.s[s.k].no.length).length;
  const wrong = M3.slice(0, 5).filter(s => (state.m3.s[s.k] || { no: [] }).no.length).map(s => `${s.title}: ${state.m3.s[s.k].no.map(o => s.k === 'sun' ? SUN_O[o] : ARW[o]).join(', ')}`).join(' / ');
  return [
    stat(0, okCount(M1Q, state.m1.q), M1Q.length), stat(1, okCount(M2Q, state.m2.q), M2Q.length),
    stat(2, m3ok, M3.length), stat(3, okCount(QUIZ, state.m4.q), QUIZ.length),
    `${firstOk(M1Q, state.m1.q)}/${M1Q.length}`, `${firstOk(M2Q, state.m2.q)}/${M2Q.length}`, `${pred}/${M3.length}`, `${firstOk(QUIZ, state.m4.q)}/${QUIZ.length}`, wrong, `${state.game.cleared}/3단계`,
    MV.map(m => state[m].tries || 0).join(' · ')
  ];
}
async function sync(force) {
  if (!CONFIG.SUBMIT_URL || !state.code || !state.num) return null;
  const vals = progressVals(), sig = [state.num, state.name].concat(vals).join('|');
  if (!force && sig === state.sentSig) return null;
  try {
    if (!(await hello())) return { ok: false, error: 'server' };
    const out = await post({ lesson: CONFIG.LESSON, action: 'save', code: state.code, num: state.num, name: state.name, cols: COLS, vals });
    if (out.ok) { state.sentSig = sig; state.sent = true; try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
    return out;
  } catch (err) { return { ok: false, error: 'net' }; }
}
async function submit() {
  if (!state.code) { ui.submitMsg = '수업 코드 없이 시작해서 보낼 수 없어요. 처음 화면에서 다시 시작해 주세요.'; render(); return; }
  ui.submitMsg = '보내는 중…'; render();
  const out = await sync(true);
  ui.submitMsg = out && out.ok ? '✔ 선생님께 보냈어요.' : out && out.error === 'code' ? '수업 코드가 맞지 않아요.' : out && out.error === 'server' ? '아직 결과를 받을 준비가 안 됐어요. 선생님께 알려 주세요. (이 화면을 캡처해서 내도 돼요)' : '인터넷 연결을 확인해 주세요. 계속 안 되면 이 화면을 캡처해서 내세요.';
  render();
}

enter('intro');
</script>
<!-- ───────── 수업 모드 레이저 포인터: 학생들이 TV에서 선생님이 가리키는 곳을 쉽게 찾도록 ─────────
     수업 모드에서만 마우스 위치에 빨간 고리가 따라다니고, 누르면 퍼지는 물결이 나와요.
     왼쪽 아래 버튼으로 켜고 끌 수 있어요(브라우저에 기억). 터치(전자칠판·태블릿)로 누를 때는 물결만 나와요. -->
<style>
#lp-ring{position:fixed;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:5px solid #ff2d6f;background:radial-gradient(circle,#ff2d6f 0 5px,#ff2d6f33 6px 100%);box-shadow:0 0 18px 6px #ff2d6faa,inset 0 0 10px #ff2d6f88;pointer-events:none;z-index:2147483646;display:none;transition:width .12s,height .12s,margin .12s}
#lp-ring.down{width:48px;height:48px;margin:-24px 0 0 -24px}
.lp-wave{position:fixed;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:4px solid #ff2d6f;pointer-events:none;z-index:2147483645;animation:lpw .6s ease-out forwards}
@keyframes lpw{to{transform:scale(7);opacity:0}}
#lp-btn{position:fixed;left:14px;bottom:14px;z-index:2147483647;display:none;padding:8px 14px;border-radius:999px;border:2px solid #ff2d6f;background:#140a1ce6;color:#ffd0de;font:700 15px "Noto Sans KR",sans-serif;cursor:pointer}
#lp-btn.off{border-color:#6b7394;color:#aab3d6}
body.lp-on,body.lp-on *{cursor:none!important}
body.lp-on #lp-btn{cursor:pointer!important}
</style>
<div id="lp-ring"></div><button id="lp-btn" type="button"></button>
<script>
(() => {
  const ring = document.getElementById('lp-ring'), btn = document.getElementById('lp-btn');
  let want = true, mouse = false, x = -100, y = -100;
  try { want = localStorage.getItem('lp-off') !== '1'; } catch (e) {}
  const inClass = () => !!document.querySelector('.cl-stage');
  const sync = () => {
    const cls = inClass(), on = cls && want && mouse;
    btn.style.display = cls ? 'block' : 'none';
    btn.textContent = want ? '🔴 포인터 켜짐' : '⚪ 포인터 꺼짐'; btn.classList.toggle('off', !want);
    ring.style.display = on ? 'block' : 'none';
    document.body.classList.toggle('lp-on', on && !btn.matches(':hover'));
  };
  btn.addEventListener('click', e => { e.stopPropagation(); want = !want; try { localStorage.setItem('lp-off', want ? '0' : '1'); } catch (er) {} sync(); });
  addEventListener('pointermove', e => {
    mouse = e.pointerType === 'mouse'; x = e.clientX; y = e.clientY;
    ring.style.transform = `translate(${x}px,${y}px)`; sync();
  }, { passive: true });
  addEventListener('pointerdown', e => {
    if (!inClass() || !want || e.target === btn) return;
    if (e.pointerType === 'mouse') ring.classList.add('down');
    const w = document.createElement('div'); w.className = 'lp-wave'; w.style.left = e.clientX + 'px'; w.style.top = e.clientY + 'px';
    document.body.appendChild(w); setTimeout(() => w.remove(), 650);
  }, true);
  addEventListener('pointerup', () => ring.classList.remove('down'), true);
  document.addEventListener('mouseleave', () => { ring.style.display = 'none'; });
  new MutationObserver(sync).observe(document.getElementById('app') || document.body, { childList: true });
  sync();
})();
</script>
